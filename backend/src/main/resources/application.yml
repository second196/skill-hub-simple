server:
  port: 8080

spring:
  application:
    name: skill-hub
  datasource:
    url: ${SKILLHUB_DB_URL:jdbc:postgresql://localhost:5432/skillhub}
    username: ${SKILLHUB_DB_USERNAME:postgres}
    password: ${SKILLHUB_DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

skillhub:
  upload:
    max-package-bytes: ${SKILLHUB_MAX_PACKAGE_BYTES:10485760}
    max-expanded-bytes: ${SKILLHUB_MAX_EXPANDED_BYTES:104857600}
    max-files: ${SKILLHUB_MAX_FILES:1000}
