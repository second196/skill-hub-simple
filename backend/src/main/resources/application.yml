server:
  port: 8080
  tomcat:
    max-http-form-post-size: ${SKILLHUB_MAX_HTTP_POST_SIZE:1GB}
    max-swallow-size: ${SKILLHUB_MAX_HTTP_POST_SIZE:1GB}

spring:
  application:
    name: skill-hub
  servlet:
    multipart:
      # Keep the HTTP multipart limit above the SkillHub package limit so
      # large ZIP uploads reach the application-level parser.
      max-file-size: ${SKILLHUB_MULTIPART_MAX_FILE_SIZE:1GB}
      max-request-size: ${SKILLHUB_MULTIPART_MAX_REQUEST_SIZE:1GB}
  datasource:
    url: ${SKILLHUB_DB_URL:jdbc:postgresql://localhost:5432/skillhub}
    username: ${SKILLHUB_DB_USERNAME:postgres}
    password: ${SKILLHUB_DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

skillhub:
  analysis:
    # Analysis is a side path. These knobs are defaults, overridable per environment.
    max-turns: ${SKILLHUB_ANALYSIS_MAX_TURNS:200}
    max-sessions-for-paths: ${SKILLHUB_ANALYSIS_MAX_SESSIONS_FOR_PATHS:100}
    coverage-warn-threshold: ${SKILLHUB_ANALYSIS_COVERAGE_WARN_THRESHOLD:0.8}
    conflict-min-turns: ${SKILLHUB_ANALYSIS_CONFLICT_MIN_TURNS:2}
    p95-quantile: ${SKILLHUB_ANALYSIS_P95_QUANTILE:0.95}
    llm:
      enabled: ${SKILLHUB_ANALYSIS_LLM_ENABLED:false}
      endpoint: ${SKILLHUB_ANALYSIS_LLM_ENDPOINT:}
      api-key: ${SKILLHUB_ANALYSIS_LLM_API_KEY:}
      model: ${SKILLHUB_ANALYSIS_LLM_MODEL:gpt-4.1-mini}
      embedding-model: ${SKILLHUB_ANALYSIS_LLM_EMBEDDING_MODEL:text-embedding-3-small}
      timeout-ms: ${SKILLHUB_ANALYSIS_LLM_TIMEOUT_MS:30000}
      max-tokens: ${SKILLHUB_ANALYSIS_LLM_MAX_TOKENS:2000}
      sample-limit: ${SKILLHUB_ANALYSIS_LLM_SAMPLE_LIMIT:20}
      coverage-threshold: ${SKILLHUB_ANALYSIS_LLM_COVERAGE_THRESHOLD:0.6}
      daily-token-budget: ${SKILLHUB_ANALYSIS_LLM_DAILY_TOKEN_BUDGET:50000}
  optimize:
    # Skill optimize pipeline workers (daemon pool; scheduler only claims + submits).
    workers: ${SKILLHUB_OPTIMIZE_WORKERS:2}
    worker-delay-ms: ${SKILLHUB_OPTIMIZE_WORKER_DELAY_MS:5000}
  upload:
    max-package-bytes: ${SKILLHUB_MAX_PACKAGE_BYTES:1073741824}
    max-expanded-bytes: ${SKILLHUB_MAX_EXPANDED_BYTES:1073741824}
    max-files: ${SKILLHUB_MAX_FILES:100000}
  observation:
    # Observation retention (aligned with kmplm's 90/180-day cleanup cron).
    # Disabled by default: deletion only happens with explicit config, and a
    # step-days/session-days value of 0 skips that tier entirely.
    retention:
      enabled: ${SKILLHUB_OBSERVATION_RETENTION_ENABLED:false}
      step-days: ${SKILLHUB_OBSERVATION_RETENTION_STEP_DAYS:90}
      session-days: ${SKILLHUB_OBSERVATION_RETENTION_SESSION_DAYS:180}
      cron: ${SKILLHUB_OBSERVATION_RETENTION_CRON:0 30 4 * * ?}
  discovery:
    github:
      # Comma- or space-separated repositories. When empty, the scheduled
      # sync searches GitHub for the configured topic query.
      repositories: ${SKILLHUB_DISCOVERY_GITHUB_REPOSITORIES:anthropics/skills,addyosmani/agent-skills,nextlevelbuilder/ui-ux-pro-max-skill,K-Dense-AI/scientific-agent-skills}
      search-query: ${SKILLHUB_DISCOVERY_GITHUB_SEARCH_QUERY:topic:agent-skills}
      max-repositories: ${SKILLHUB_DISCOVERY_GITHUB_MAX_REPOSITORIES:12}
    sync:
      enabled: ${SKILLHUB_DISCOVERY_SYNC_ENABLED:true}
      initial-delay-ms: ${SKILLHUB_DISCOVERY_SYNC_INITIAL_DELAY_MS:5000}
      interval-ms: ${SKILLHUB_DISCOVERY_SYNC_INTERVAL_MS:21600000}
